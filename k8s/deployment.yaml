apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-metrics-app
  labels:
    app: demo-metrics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-metrics-app
  template:
    metadata:
      labels:
        app: demo-metrics-app
    spec:
      containers:
        - name: demo-metrics-app
          image: demo-metrics-app:latest
          # Built locally with `docker build` and loaded straight into
          # Minikube's node - never pulled from a registry, so
          # IfNotPresent is required here.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
