name: Run Lint Check via Pylint  
  
on: [push]  
  
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pylint

      - name: Install project dependencies
        run: pip install -r requirements.txt && pip install -r PyPowerStore/tests/unit_tests/requirements.txt

      - name: Analyzing the code with pylint
        run: pylint $(git ls-files '*.py')

  security-scan:
    name: pip-audit (dependency vulnerability scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip && pip install pip-audit

      - name: Audit requirements.txt and fail on HIGH/CRITICAL severity
        run: python .github/scripts/pip_audit_severity_gate.py requirements.txt
